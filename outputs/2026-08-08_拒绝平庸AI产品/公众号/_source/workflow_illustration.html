<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFFFFF; font-family: -apple-system, "PingFang SC", sans-serif; }
  .wrap { width: 760px; padding: 48px 40px; }
  .title { font-size: 30px; font-weight: 900; color: #1C1917; margin-bottom: 30px; }
  .flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .node { background: #FEF2F2; border: 2px solid #FCA5A5; border-radius: 18px; padding: 20px 22px; text-align: center; width: 190px; }
  .node .emoji { font-size: 34px; }
  .node .name { font-size: 20px; font-weight: 900; color: #DC2626; margin-top: 8px; }
  .node .sub { font-size: 14px; color: #6B7280; margin-top: 4px; }
  .arrow { font-size: 30px; color: #DC2626; font-weight: 900; }
  .foot { margin-top: 30px; font-size: 15px; color: #9CA3AF; border-top: 1px dashed #F3E2E2; padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">一套别人抄不走的内容工作流（一人公司实证）</div>
  <div class="flow">
    <div class="node"><div class="emoji">📡</div><div class="name">热点雷达</div><div class="sub">RSSHub + 谷歌趋势 + X</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">🧭</div><div class="name">选题拍板</div><div class="sub">人工决策卡点 1</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">🤖</div><div class="name">三平台成稿</div><div class="sub">小红书 / 公众号 / 视频</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">🛡️</div><div class="name">双轨质检</div><div class="sub">契约校验 + Harsh 评分</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">📦</div><div class="name">人工发布</div><div class="sub">决策卡点 2 + 数据回收</div></div>
  </div>
  <div class="foot">工具会降价，把工具串成闭环的流程不会。｜ 小吴聊 NAS 内容工厂（2026-08）</div>
</div>
</body>
</html>
