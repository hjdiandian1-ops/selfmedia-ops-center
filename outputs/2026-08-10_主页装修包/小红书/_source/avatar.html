<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#070b14; }
.stage {
  position:relative; width:540px; height:540px;
  background: radial-gradient(circle at 50% 42%, #101a2e 0%, #0a1120 45%, #060a12 100%);
  display:flex; align-items:center; justify-content:center;
}
.grid {
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(0,255,163,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,163,.06) 1px, transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 25%, transparent 75%);
  mask-image: radial-gradient(circle at 50% 45%, #000 25%, transparent 75%);
}
.badge {
  position:relative; width:270px; height:270px; border-radius:58px;
  background: linear-gradient(145deg,#12233c 0%,#0a1322 60%,#081020 100%);
  border:4px solid rgba(0,255,163,.75);
  box-shadow: 0 0 60px rgba(0,255,163,.28), inset 0 0 30px rgba(0,255,163,.12);
  display:flex; align-items:center; justify-content:center;
}
.badge::before {
  content:""; position:absolute; inset:10px;
  border:2px solid rgba(0,255,163,.28); border-radius:46px;
}
.ai {
  font-family:"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  font-weight:800; font-size:118px; letter-spacing:-4px;
  background: linear-gradient(180deg,#eafff5 0%,#00ffa3 72%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow: 0 0 34px rgba(0,255,163,.35);
}
.dot { position:absolute; width:16px; height:16px; border-radius:50%; background:#ffb020; box-shadow:0 0 18px rgba(255,176,32,.9); }
.dot.a { top:70px; right:82px; }
.dot.b { bottom:74px; left:88px; }
.ring { position:absolute; width:18px; height:18px; border:3px solid rgba(255,176,32,.8); border-radius:50%; }
.ring.a { top:108px; left:72px; }
.ring.b { bottom:110px; right:72px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="badge">
      <span class="ai">AI</span>
      <span class="dot a"></span><span class="dot b"></span>
      <span class="ring a"></span><span class="ring b"></span>
    </div>
  </div>
</body>
</html>
