<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#070b14; }
.stage {
  position:relative; width:540px; height:720px; overflow:hidden;
  background:
    radial-gradient(circle at 82% 18%, rgba(0,229,160,.20) 0%, transparent 42%),
    radial-gradient(circle at 12% 88%, rgba(0,229,160,.10) 0%, transparent 38%),
    linear-gradient(160deg,#0e1830 0%,#0a1120 55%,#070b14 100%);
}
.grid {
  position:absolute; inset:0; opacity:.55;
  background-image:
    linear-gradient(rgba(0,229,160,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,160,.07) 1px, transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 80%);
  mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 80%);
}
.brand {
  position:absolute; top:46px; left:48px;
  display:flex; align-items:center; gap:12px;
  color:#cfe9ff; font-family:"PingFang SC",sans-serif; font-size:21px; font-weight:600; letter-spacing:1px;
}
.brand .bd { width:13px; height:13px; border-radius:50%; background:#00e5a0; box-shadow:0 0 14px #00e5a0; }
.hero { position:absolute; left:48px; top:258px; width:390px; z-index:2; }
.kicker {
  color:#7dffd0; font-size:21px; letter-spacing:7px; font-weight:700;
  font-family:"SF Pro Display","PingFang SC",sans-serif; margin-bottom:20px;
}
h1 {
  font-family:"SF Pro Display","PingFang SC",sans-serif;
  font-size:92px; line-height:1.06; font-weight:800; letter-spacing:-2px; color:#f2f7ff;
}
.sub { margin-top:24px; font-size:32px; font-weight:500; color:#a9c0dc; font-family:"PingFang SC",sans-serif; }
.icon {
  position:absolute; right:30px; top:120px; width:170px; height:170px;
  display:flex; align-items:center; justify-content:center;
  border:2px solid rgba(0,229,160,.35); border-radius:38px;
  background: rgba(0,229,160,.06); box-shadow:0 0 46px rgba(0,229,160,.14);
}
.footer {
  position:absolute; left:48px; bottom:52px; z-index:2;
  display:flex; align-items:center; gap:14px;
  color:#6f88a8; font-size:20px; font-family:"PingFang SC",sans-serif;
}
.footer .line { width:36px; height:2px; background:#00e5a0; }
.chip {
  position:absolute; right:48px; bottom:54px; z-index:2;
  padding:12px 20px; border:2px solid rgba(255,255,255,.16); border-radius:999px;
  color:#d7eaff; font-size:19px; letter-spacing:3px; font-family:"PingFang SC",sans-serif;
}
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="brand"><span class="bd"></span>小吴聊的AI Lab</div>
    <div class="icon">
      <svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="7" width="10" height="10" rx="2"></rect>
        <path d="M4 4h3M17 4h3M4 17v3M4 4v3M20 4v3M20 17v3M4 20h3M17 20h3"></path>
        <circle cx="12" cy="12" r="2.2" fill="#00e5a0" stroke="none"></circle>
      </svg>
    </div>
    <div class="hero">
      <div class="kicker">AI APPLICATION LAB</div>
      <h1>AI 应用<br>实测</h1>
      <div class="sub">新东西，先测再聊</div>
    </div>
    <div class="footer"><span class="line"></span>合集 · 每周更新</div>
    <div class="chip">CONTENT</div>
  </div>
</body>
</html>
