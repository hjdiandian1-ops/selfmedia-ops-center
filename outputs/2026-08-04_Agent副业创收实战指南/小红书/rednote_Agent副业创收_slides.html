<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书 3:4 视觉卡片 - Agent 副业创收 (guizang-social-card-skill)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
        }
        .card {
            width: 540px;
            height: 720px;
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tag {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .brand {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        .title {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.35;
            color: #ffffff;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .title span {
            color: #34d399;
            background: linear-gradient(90deg, #34d399, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .point-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .point-item {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .point-num {
            background: #10b981;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .point-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .point-text strong {
            color: #f8fafc;
        }
        .footer {
            border-top: 1px solid #334155;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #64748b;
        }
        .author {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="tag">⚡ guizang-social-card-skill</span>
            <span class="brand">小吴聊 · 科技操盘手</span>
        </div>
        <div>
            <h1 class="title">写了10个Agent却没赚到1块钱？<br>拆解 3 个<span>实战落地刀法</span></h1>
            <div class="point-list">
                <div class="point-item">
                    <div class="point-num">1</div>
                    <div class="point-text"><strong>不卖工具卖结果：</strong>挂 29 元/单合同盲审代运行，后台 Agent 自动跑，1分钟审核打勾交付。</div>
                </div>
                <div class="point-item">
                    <div class="point-num">2</div>
                    <div class="point-text"><strong>80% Workflow + 20% LLM：</strong>硬逻辑全用 Python/n8n 写死，故障率低于 0.1%。</div>
                </div>
                <div class="point-item">
                    <div class="point-num">3</div>
                    <div class="point-text"><strong>做数据结构化中间商：</strong>定时抓取二手车/爆品行情，渲染 3:4 卡片做私域 99元/月 订阅。</div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="author">⚡ 小吴聊 AI 硬核拆解</div>
            <div>扫码/搜索关注更多干货</div>
        </div>
    </div>
</body>
</html>
