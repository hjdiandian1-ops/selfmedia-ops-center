<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFFFFF; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { width: 760px; padding: 48px 40px; }
  .title { font-size: 30px; font-weight: 900; color: #1C1917; margin-bottom: 30px; }
  .flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .node { background: #FEF2F2; border: 2px solid #FCA5A5; border-radius: 18px; padding: 20px 18px; text-align: center; width: 132px; }
  .node .emoji { font-size: 32px; }
  .node .name { font-size: 18px; font-weight: 900; color: #DC2626; margin-top: 8px; }
  .node .sub { font-size: 13px; color: #6B7280; margin-top: 4px; line-height: 1.5; }
  .arrow { font-size: 26px; color: #DC2626; font-weight: 900; }
  .loop { margin-top: 30px; background: #1C1917; color: #fff; border-radius: 16px; padding: 18px 22px; font-size: 18px; font-weight: 700; }
  .foot { margin-top: 24px; font-size: 14px; color: #9CA3AF; border-top: 1px dashed #F3E2E2; padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">技能沉淀飞轮：经验越用越厚</div>
  <div class="flow">
    <div class="node"><div class="emoji">🧠</div><div class="name">经验</div><div class="sub">老师傅踩过的坑</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">📄</div><div class="name">SKILL.md</div><div class="sub">步骤 + 检查清单</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">🤖</div><div class="name">复用</div><div class="sub">AI 按手册执行</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">🔁</div><div class="name">返工修正</div><div class="sub">错在哪、怎么改</div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="emoji">📚</div><div class="name">版本库</div><div class="sub">每 5 次迭代一版</div></div>
  </div>
  <div class="loop">工具会降价、模型会换代，私有技能库像复利一样越滚越厚。</div>
  <div class="foot">参考：新京报贝壳财经实测报道（2026-01）｜ 小吴聊 · Skill 革命</div>
</div>
</body>
</html>
