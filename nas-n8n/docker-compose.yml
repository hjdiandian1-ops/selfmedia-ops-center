version: '3.8'

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: n8n_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: blowsnow/n8n-chinese:latest
    container_name: n8n
    restart: always
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password_change_me}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_SECURE_COOKIE=false
      - N8N_DEFAULT_LOCALE=zh-CN
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
      # 支持 npm 包和外部 HTTP 节点
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    links:
      - postgres
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./shared_files:/data/shared
    depends_on:
      postgres:
        condition: service_healthy

  # 小红书自动化无头浏览器发布执行器（Python 3.10 + Playwright 服务）
  xhs-publisher:
    image: docker.m.daocloud.io/library/python:3.10-slim
    container_name: xhs_publisher
    restart: always
    ports:
      - "5800:8000"
    volumes:
      - ./xhs_worker:/app
      - ./shared_files:/data/shared
    working_dir: /app
    command: >
      bash -c "rm -f /data/shared/main.py &&
               pip install fastapi uvicorn playwright pydantic -i https://pypi.tuna.tsinghua.edu.cn/simple &&
               playwright install-deps chromium &&
               playwright install chromium &&
               python main.py"
    environment:
      - TZ=Asia/Shanghai
