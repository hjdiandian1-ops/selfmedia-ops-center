<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<style>
  :root {
    --bg: #090d16;
    --card: #131b2e;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.4);
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 120px 80px;
    overflow: hidden;
    position: relative;
  }

  /* 背景光晕 */
  .glow-circle {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--accent-glow) 0%, rgba(9,13,22,0) 70%);
    z-index: 0;
    pointer-events: none;
  }

  .header {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag {
    background: var(--accent);
    color: #090d16;
    font-size: 28px;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 999px;
    letter-spacing: 2px;
  }
  .timer {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .main-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 48px;
  }

  .scene-title {
    font-size: 68px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -1.5px;
  }
  .scene-title span {
    color: var(--accent);
  }

  .visual-card {
    background: var(--card);
    border: 2px solid #23314f;
    border-radius: 36px;
    padding: 56px;
    display: flex;
    flex-direction: column;
    gap: 36px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .bullet-row {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 38px;
    font-weight: 600;
    color: var(--text);
  }
  .bullet-row strong {
    color: var(--accent);
  }

  .progress-bar-container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 12px;
    background: #1e293b;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    border-radius: 6px;
    transition: width 0.05s linear;
  }
</style>
</head>
<body>
  <div class="glow-circle"></div>

  <div class="header">
    <div class="tag">{{ tag or "SOP 拆解" }}</div>
    <div class="timer" id="timeDisplay">00:00</div>
  </div>

  <div class="main-content">
    <h1 class="scene-title">{{ headline | safe }}</h1>

    <div class="visual-card">
      {% for b in bullets %}
      <div class="bullet-row">
        <span>{{ b.icon or "⚡" }}</span>
        <span>{{ b.text | safe }}</span>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>

  <script>
    // 供无头浏览器以 100% 确定性进度逐帧驱动
    window.setTimelineProgress = function(progress, currentTimeStr) {
      document.getElementById('progressFill').style.width = (progress * 100) + '%';
      if (currentTimeStr) {
        document.getElementById('timeDisplay').textContent = currentTimeStr;
      }
    };
  </script>
</body>
</html>
